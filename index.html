<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f8eee8">
  <title>A private letter</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f8eee8'/%3E%3Cpath d='M32 50S12 39 12 24c0-8 10-13 20-3 10-10 20-5 20 3 0 15-20 26-20 26Z' fill='%23a95f62'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { background: #f8eee8; color: #352826; font-family: Georgia, serif; }
    #gate { min-height: 100vh; display: grid; place-items: center; padding: 32px; text-align: center; }
    .card { width: min(520px, 100%); padding: 48px 34px; border: 1px solid rgba(83, 52, 48, .16); border-radius: 28px; background: rgba(255,255,255,.58); box-shadow: 0 28px 80px rgba(92, 58, 51, .12); }
    .heart { color: #a95f62; font-size: 38px; line-height: 1; }
    h1 { margin: 18px 0 10px; font-size: clamp(2.2rem, 8vw, 4rem); font-weight: 500; }
    p { margin: 0; color: #74625e; font: 500 1rem/1.7 system-ui, sans-serif; }
    .spinner { width: 34px; height: 34px; margin: 28px auto 0; border: 3px solid rgba(169,95,98,.2); border-top-color: #a95f62; border-radius: 50%; animation: spin .9s linear infinite; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f8eee8; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="gate">
    <div class="card">
      <div class="heart" aria-hidden="true">♡</div>
      <h1>A private letter</h1>
      <p id="status">Opening something made with care…</p>
      <div class="spinner" id="spinner" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    const CHUNK_COUNT = 20;
    const statusNode = document.getElementById("status");
    const spinner = document.getElementById("spinner");

    function decodeBase64Url(value) {
      const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
      const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
      const raw = atob(padded);
      return Uint8Array.from(raw, char => char.charCodeAt(0));
    }

    async function openLetter() {
      try {
        const keyValue = new URLSearchParams(location.hash.slice(1)).get("key");
        if (!keyValue) throw new Error("missing-key");
        const keyBytes = decodeBase64Url(keyValue);
        if (keyBytes.byteLength !== 32) throw new Error("bad-key");

        const parts = await Promise.all(
          Array.from({ length: CHUNK_COUNT }, async (_, index) => {
            const name = String(index).padStart(3, "0");
            const response = await fetch(`payload/${name}.bin`, { cache: "force-cache" });
            if (!response.ok) throw new Error("missing-payload");
            return new Uint8Array(await response.arrayBuffer());
          })
        );
        const length = parts.reduce((total, part) => total + part.byteLength, 0);
        const sealed = new Uint8Array(length);
        let offset = 0;
        for (const part of parts) { sealed.set(part, offset); offset += part.byteLength; }

        const iv = sealed.slice(0, 12);
        const ciphertext = sealed.slice(12);
        const key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
        const compressed = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
        const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
        const html = await new Response(stream).text();

        const frame = document.createElement("iframe");
        frame.title = "Private letter";
        frame.srcdoc = html;
        document.body.replaceChildren(frame);
      } catch (error) {
        spinner.hidden = true;
        statusNode.textContent = error.message === "missing-key"
          ? "This private link is incomplete. Please use the full link that was shared with you."
          : "This link could not unlock the letter. Please ask for the complete link again.";
      }
    }

    openLetter();
  </script>
</body>
</html>
